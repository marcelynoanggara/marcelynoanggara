<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Marcel, Information Technology student at Telkom University Surabaya">
  <title>Marcel, Information Technology student at Telkom University Surabaya</title>
  <style>
    .bg { fill: #0a0f1e; }
    .domain { font-family: "Courier New", monospace; font-size: 21px; font-weight: 700; letter-spacing: 6px; fill: #8fe388; }
    .name { font-family: Verdana, "DejaVu Sans", sans-serif; font-size: 84px; font-weight: 700; fill: #f0f4fa; }
    .sub { font-family: Verdana, "DejaVu Sans", sans-serif; font-size: 29px; fill: #aeb9cf; }
    .divider { stroke: #24304a; stroke-width: 2; }
    .line-base { stroke: #26314d; stroke-width: 3; }
    .line-prog { stroke: #8fe388; stroke-width: 3; stroke-dasharray: 1032; stroke-dashoffset: 0; animation: draw 6s ease-in-out infinite; }
    .cursor { fill: #8fe388; animation: blink 1.1s step-end infinite; }
    circle { fill: #8fe388; stroke: #8fe388; stroke-width: 3; }
    .c1 { animation: a1 6s ease-in-out infinite; }
    .c2 { animation: a2 6s ease-in-out infinite; }
    .c3 { animation: a3 6s ease-in-out infinite; }
    .c4 { animation: a4 6s ease-in-out infinite; }
    .c5 { animation: a5 6s ease-in-out infinite; }
    .lab { font-family: Verdana, "DejaVu Sans", sans-serif; font-size: 19px; fill: #e6edf7; text-anchor: middle; }
    .t1 { animation: l1 6s ease-in-out infinite; }
    .t2 { animation: l2 6s ease-in-out infinite; }
    .t3 { animation: l3 6s ease-in-out infinite; }
    .t4 { animation: l4 6s ease-in-out infinite; }
    .t5 { animation: l5 6s ease-in-out infinite; }
    @keyframes draw {
      0% { stroke-dashoffset: 1032; opacity: 1; }
      48% { stroke-dashoffset: 0; opacity: 1; }
      86% { stroke-dashoffset: 0; opacity: 1; }
      96% { stroke-dashoffset: 0; opacity: 0.25; }
      100% { stroke-dashoffset: 1032; opacity: 0.25; }
    }
    @keyframes a1 {
      0% { fill: #0a0f1e; stroke: #3a4763; }
      4% { fill: #8fe388; stroke: #8fe388; }
      86% { fill: #8fe388; stroke: #8fe388; }
      96%, 100% { fill: #0a0f1e; stroke: #3a4763; }
    }
    @keyframes a2 {
      0%, 11% { fill: #0a0f1e; stroke: #3a4763; }
      15% { fill: #8fe388; stroke: #8fe388; }
      86% { fill: #8fe388; stroke: #8fe388; }
      96%, 100% { fill: #0a0f1e; stroke: #3a4763; }
    }
    @keyframes a3 {
      0%, 22% { fill: #0a0f1e; stroke: #3a4763; }
      26% { fill: #8fe388; stroke: #8fe388; }
      86% { fill: #8fe388; stroke: #8fe388; }
      96%, 100% { fill: #0a0f1e; stroke: #3a4763; }
    }
    @keyframes a4 {
      0%, 33% { fill: #0a0f1e; stroke: #3a4763; }
      37% { fill: #8fe388; stroke: #8fe388; }
      86% { fill: #8fe388; stroke: #8fe388; }
      96%, 100% { fill: #0a0f1e; stroke: #3a4763; }
    }
    @keyframes a5 {
      0%, 44% { fill: #0a0f1e; stroke: #3a4763; }
      48% { fill: #8fe388; stroke: #8fe388; }
      86% { fill: #8fe388; stroke: #8fe388; }
      96%, 100% { fill: #0a0f1e; stroke: #3a4763; }
    }
    @keyframes l1 {
      0% { opacity: 0.35; } 4% { opacity: 1; }
      86% { opacity: 1; } 96%, 100% { opacity: 0.35; }
    }
    @keyframes l2 {
      0%, 11% { opacity: 0.35; } 15% { opacity: 1; }
      86% { opacity: 1; } 96%, 100% { opacity: 0.35; }
    }
    @keyframes l3 {
      0%, 22% { opacity: 0.35; } 26% { opacity: 1; }
      86% { opacity: 1; } 96%, 100% { opacity: 0.35; }
    }
    @keyframes l4 {
      0%, 33% { opacity: 0.35; } 37% { opacity: 1; }
      86% { opacity: 1; } 96%, 100% { opacity: 0.35; }
    }
    @keyframes l5 {
      0%, 44% { opacity: 0.35; } 48% { opacity: 1; }
      86% { opacity: 1; } 96%, 100% { opacity: 0.35; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .line-prog, circle, .lab, .cursor { animation: none; }
      .line-prog { stroke-dashoffset: 0; }
    }
  </style>

  <rect class="bg" width="1200" height="360" />
  <text class="domain" x="64" y="62">MARCHANGGARA.MY.ID</text>
  <text class="name" x="62" y="158">Marcel</text>
  <rect class="cursor" x="407" y="96" width="15" height="62" />
  <text class="sub" x="64" y="212">Information Technology student, Telkom University Surabaya</text>
  <line class="divider" x1="64" y1="238" x2="1136" y2="238" />

  <line class="line-base" x1="84" y1="284" x2="1116" y2="284" />
  <line class="line-prog" x1="84" y1="284" x2="1116" y2="284" />

  <circle class="c1" cx="84" cy="284" r="11" />
  <text class="lab t1" x="84" y="322">Portfolio</text>
  <circle class="c2" cx="342" cy="284" r="11" />
  <text class="lab t2" x="342" y="322">NihonGo Master</text>
  <circle class="c3" cx="600" cy="284" r="11" />
  <text class="lab t3" x="600" y="322">CV Builder</text>
  <circle class="c4" cx="858" cy="284" r="11" />
  <text class="lab t4" x="858" y="322">QR Generator</text>
  <circle class="c5" cx="1116" cy="284" r="11" />
  <text class="lab t5" x="1116" y="322">AI Data Analyze</text>
</svg>
